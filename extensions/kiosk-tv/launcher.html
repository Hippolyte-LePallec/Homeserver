<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Google TV Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 20% 20%, #1f242d, #0e1015 80%);
            color: #f1f3f4;
            font-family: 'Liberation Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px 64px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo span {
            color: #8ab4f8;
        }

        #clock {
            font-size: 24px;
            color: #9aa0a6;
        }

        .hero {
            margin: auto 0;
        }

        .hero h1 {
            font-size: 44px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .hero p {
            font-size: 20px;
            color: #9aa0a6;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 20px;
            color: #e8eaed;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 24px;
        }

        .app-card {
            background: #1e222b;
            border-radius: 16px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .app-card:focus,
        .app-card.focused {
            transform: scale(1.08);
            border-color: #f1f3f4;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            background: #282d38;
        }

        .yt {
            color: #ff4e45;
        }

        .nf {
            color: #e50914;
        }

        .pv {
            color: #00a8e1;
        }

        .tw {
            color: #a970ff;
        }

        .jf {
            color: #aa5cc3;
        }

        footer {
            font-size: 15px;
            color: #5f6368;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo"><span>Google</span> TV</div>
        <div id="clock">--:--</div>
    </header>

    <main class="hero">
        <h1>Pour vous</h1>
        <p>Naviguez avec les flèches ou envoyez une commande depuis le conteneur Master</p>

        <div class="section-title">Vos applications</div>
        <div class="apps-grid">
            <a href="https://www.youtube.com/tv" class="app-card yt" tabindex="0">YouTube TV</a>
            <a href="https://www.netflix.com" class="app-card nf" tabindex="0">Netflix</a>
            <a href="https://www.primevideo.com" class="app-card pv" tabindex="0">Prime Video</a>
            <a href="https://www.twitch.tv" class="app-card tw" tabindex="0">Twitch</a>
            <a href="https://app.plex.tv" class="app-card jf" tabindex="0">Plex TV</a>
        </div>
    </main>

    <footer>
        <span>HomeSystem • Module Kiosk-TV (TCP 5000)</span>
        <span>Utilisez Flèches + Entrée pour lancer</span>
    </footer>

    <script>
        const cards = document.querySelectorAll('.app-card');
        let currentIndex = 0;

        function updateFocus(index) {
            currentIndex = (index + cards.length) % cards.length;
            cards[currentIndex].focus();
        }

        window.addEventListener('DOMContentLoaded', () => updateFocus(0));

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') { e.preventDefault(); updateFocus(currentIndex + 1); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); updateFocus(currentIndex - 1); }
            if (e.key === 'Enter') { window.location.href = cards[currentIndex].href; }
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>

</html>
